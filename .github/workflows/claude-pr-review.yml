# Independent PR review by Claude.
# Runs in GitHub on every non-draft PR from this repo, in a fresh context with
# read-only repo access. It can only read the PR and post comments; it cannot
# push, approve, or merge.
#
# One-time setup (repo owner):
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Run `claude setup-token` locally (uses your Claude Pro/Max plan)
#   3. Save the token as repo secret CLAUDE_CODE_OAUTH_TOKEN
#      (Settings > Secrets and variables > Actions)
# This file must be on `main` before it can review PRs.

name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to the same PR cancels the in-progress review
concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts, and PRs from forks (secrets aren't available to them)
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are an independent reviewer for brinellermoe.com, a live author
            website with real traffic. You did not write this change. The PR
            branch is checked out in the working directory. Read CLAUDE.md first:
            it holds the project's rules. Use `gh pr diff` and `gh pr view` to see
            the change, and read surrounding files for context.

            Merging to main deploys immediately via GitHub Pages (plain
            HTML/CSS/JS, no build step, no tests). Your job is to catch anything
            that would break or embarrass the live site. Check:

            1. Breakage: broken links or image paths, JS errors, forms that stop
               submitting or stop confirming, layout overflow on a 375px phone,
               missing width/height on images.
            2. Consistency: the <head>, nav, footer, and nav-toggle script are
               duplicated across all 9 HTML pages. Flag a change made to some
               pages but not all.
            3. Copy rules from CLAUDE.md: no em dashes in site copy, titles, meta
               tags, or alt text (the Amazon blurb is the only exception); she is
               an "independent author", never "self-published"; no fabricated
               reviews, ratings, or quotes.
            4. Brand: "The Forest Between" palette (forest green + gold). Flag any
               return of the retired burgundy/navy/dark-moody direction, and any
               text color that drops below WCAG AA contrast.
            5. Privacy and security: consent defaults must stay "denied" until
               the visitor accepts; a new third-party service must also be listed
               in privacy.html; no secrets committed (the Web3Forms access_key is
               public by design).
            6. Publishing: new .md files are served publicly unless listed under
               `exclude` in _config.yml. Placeholder URLs (e.g. PLACEHOLDER) must
               stay hidden.

            How to report:
            - Use inline comments for specific problems, each with the concrete
              failure (what a visitor would see) and a suggested fix.
            - Then post exactly one summary comment with `gh pr comment`: a
              one-line verdict ("Safe to merge", "Merge after fixes", or "Do not
              merge"), then a short list of findings, most severe first.
            - Only raise real issues. No praise, no restating the diff, no style
              nitpicks that don't affect visitors. If nothing is wrong, say
              "Safe to merge" and stop.
            - Do not add any signature or "generated by" footer.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
